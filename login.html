<script>
window.pageInit = async () => {
  if (getToken()) {
    try {
      const user = await callApi('getCurrentUser');
      $('#loginForm').classList.add('d-none');
      $('#formTitle').textContent = 'ยินดีต้อนรับกลับมา!';
      $('#loginStatus').innerHTML = `<div class="alert alert-success">เข้าสู่ระบบแล้ว: <strong>${h(user.name||user.email)}</strong></div><div class="d-flex flex-column justify-content-center gap-2"><a class="btn btn-primary w-100" href="?page=dashboard">แดชบอร์ดผู้เรียน</a>${user.role === 'admin' || user.role === 'super_admin' ? '<a class="btn btn-outline-primary w-100" href="?page=admin">Admin Backoffice</a>' : ''}<button class="btn btn-light w-100 mt-2" onclick="logout()">ออกจากระบบ</button></div>`;
    } catch(err) {
      localStorage.removeItem('appToken');
    }
  }

  $('#showRegister').addEventListener('click', (e) => {
    e.preventDefault();
    $('#loginForm').classList.add('d-none');
    $('#registerForm').classList.remove('d-none');
    $('#formTitle').textContent = 'สมัครสมาชิกใหม่';
  });

  $('#showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    $('#registerForm').classList.add('d-none');
    $('#forgotForm').classList.add('d-none');
    $('#loginForm').classList.remove('d-none');
    $('#formTitle').textContent = 'เข้าสู่ระบบ';
  });

  $('#showForgot')?.addEventListener('click', (e) => {
    e.preventDefault();
    $('#loginForm').classList.add('d-none');
    $('#forgotForm').classList.remove('d-none');
    $('#formTitle').textContent = 'ลืมรหัสผ่าน';
  });

  $('#showLoginFromForgot')?.addEventListener('click', (e) => {
    e.preventDefault();
    $('#forgotForm').classList.add('d-none');
    $('#loginForm').classList.remove('d-none');
    $('#formTitle').textContent = 'เข้าสู่ระบบ';
  });

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'กรุณารอซักครู่...';
      showGlobalLoading();
      $('#globalLoader').querySelector('.text-primary').textContent = 'กรุณารอซักครู่...';
      const res = await callApi('login', formData(e.target));
      localStorage.setItem('appToken', res.token);
      location.href = '?page=home';
    } catch (err) {
      $('#globalLoader').classList.remove('active');
      toast(err.message, 'danger');
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  });

  $('#registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'กรุณารอซักครู่...';
      showGlobalLoading();
      $('#globalLoader').querySelector('.text-primary').textContent = 'กรุณารอซักครู่...';
      const res = await callApi('register', formData(e.target));
      localStorage.setItem('appToken', res.token);
      toast('สมัครสมาชิกเรียบร้อยแล้ว!', 'success');
      location.href = '?page=home';
    } catch (err) {
      $('#globalLoader').classList.remove('active');
      toast(err.message, 'danger');
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = false; btn.textContent = 'สมัครสมาชิก';
    }
  });

  $('#forgotForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'กำลังส่ง...';
      await callApi('forgotPassword', formData(e.target));
      toast('ส่งรหัสผ่านใหม่ไปที่อีเมลแล้ว กรุณาตรวจสอบกล่องข้อความ', 'success');
      setTimeout(() => location.reload(), 3000);
    } catch (err) {
      toast(err.message, 'danger');
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = false; btn.textContent = 'ส่งรหัสผ่านใหม่ไปที่อีเมล';
    }
  });
};
</script>
</body></html>
