      <div class="surface p-4" id="cartItemsBox">
        <div class="empty text-secondary py-5">กำลังโหลด...</div>

    </div>

      <div class="surface p-4 position-sticky" style="top: 100px;">

        <div class="d-flex justify-content-between mb-2">

<?!= include('script') ?>
<script>
window.pageInit=async()=>{ 
  const user = await callApi('getCurrentUser').catch(() => null);
  const cart = getCart();
  
  const renderCart = () => {
    if (cart.length === 0) {
      $('#cartItemsBox').innerHTML = `<div class="empty text-secondary py-5"><i class="bi bi-cart-x fs-1 d-block mb-3"></i>ตะกร้าของคุณว่างเปล่า<br><br><a href="?page=courses" class="btn btn-primary">เลือกดูหลักสูตร</a></div>`;
      $('#checkoutBtn').disabled = true;
      return;
    }
    
    let html = '';
    cart.forEach(item => {
      html += `
        <div class="d-flex align-items-center justify-content-between py-3 border-bottom cart-item">
          <div>
            <h5 class="mb-1">${h(item.title)}</h5>
            <div class="text-secondary small">${item.type === 'paid' ? 'มีค่าใช้จ่าย' : 'ฟรี'}</div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="fw-bold fs-5 text-primary">${money(item.price)}</div>
            <button class="btn btn-outline-danger btn-sm px-2" onclick="removeItem('${item.id}')"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      `;
    });
    $('#cartItemsBox').innerHTML = html;
    calculateTotal();
  };
  
  window.removeItem = (id) => {
    removeFromCart(id);
    const index = cart.findIndex(c => c.id === id);
    if (index !== -1) cart.splice(index, 1);
    renderCart();
  };
  
  const calculateTotal = () => {
    let originalTotal = cart.reduce((sum, item) => sum + Number(item.price || 0), 0);
    let isVip = (user && user.vipStatus === 'approved') || $('#vipCheck').checked;
    let discount = isVip ? originalTotal * 0.3 : 0;
    let total = originalTotal - discount;
    
    $('#summaryOriginal').textContent = money(originalTotal);
    $('#summaryDiscount').textContent = '-' + money(discount);
    $('#summaryTotal').textContent = money(total);
    
    if (isVip && originalTotal > 0) {
      $('#vipDiscountRow').style.setProperty('display', 'flex', 'important');
    } else {
      $('#vipDiscountRow').style.setProperty('display', 'none', 'important');
    }
  };
  
  $('#vipCheck').addEventListener('change', calculateTotal);
  
  if (user && user.vipStatus === 'approved') {
    $('#vipCheckboxWrapper').style.display = 'none';
  }
  
  $('#checkoutBtn').addEventListener('click', () => {
    if (cart.length === 0) return;
    const isVipCheckout = $('#vipCheck').checked;
    location.href = pageUrl('payment', { cart: '1', vip: isVipCheckout ? '1' : '0' });
  });
  
  renderCart();
};
</script>
</body></html>
