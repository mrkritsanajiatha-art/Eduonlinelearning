<!doctype html><html lang="th"><head><base target="_top" href="<?= app.publishedUrl ?>"><title>ตรวจสอบเกียรติบัตร | <?= app.browserTitle ?></title><?!= include('style') ?></head>
<body><div class="topbar"><div id="ticker" class="ticker"></div></div><nav class="navbar"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="?page=home"><img class="brand-logo" src="<?= app.logoUrl ?>"><span class="brand-name">ONLINE LEARNING</span></a><span id="userSlot"></span></div></nav>
<main class="section"><div class="container" style="max-width:840px"><h1>ตรวจสอบเกียรติบัตร</h1><form id="verifyForm" class="surface p-4 mb-3"><label class="form-label">Certificate ID</label><div class="input-group"><input id="certificateId" class="form-control" value="<?= params.id || '' ?>" required><button class="btn btn-primary">ตรวจสอบ</button></div></form><div id="verifyResult"></div></div></main><?!= include('script') ?>
<script>
async function verify(){ const id=$('#certificateId').value.trim(); if(!id)return; const r=await callApi('verifyCertificate',{certificateId:id}); $('#verifyResult').innerHTML=r.status==='NOT_FOUND'?'<div class="alert alert-danger">ไม่พบเกียรติบัตร</div>':`<div class="alert ${r.status==='VALID'?'alert-success':'alert-warning'}"><h3>${h(r.status)}</h3><p>${h(r.certificate.recipientName)} · ${h(r.certificate.sourceTitle)}</p>${r.pdfUrl?`<a class="btn btn-outline-primary" target="_blank" href="${h(r.pdfUrl)}">เปิด PDF</a>`:''}</div>`; }
window.pageInit=()=>{ $('#verifyForm').addEventListener('submit',e=>{e.preventDefault();verify();}); if($('#certificateId').value) verify(); };
</script></body></html>
