<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  --primary-blue: #004b93;
  --secondary-blue: #0060c4;
  --accent-gold: #c79c3b;
  --ink: #1d2129;
  --muted: #65676b;
  --bg-page: #f5f7fb;
  --surface: #ffffff;
  --line: #e4e6eb;
}
* { box-sizing: border-box; }

body { margin: 0; font-family: "Noto Sans Thai", "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg-page); -webkit-font-smoothing: antialiased; }
a { color: var(--primary-blue); text-decoration: none; transition: 0.2s ease; }
a:hover { color: var(--secondary-blue); }
.topbar { background: var(--surface); color: var(--muted); min-height: 32px; display: flex; align-items: center; overflow: hidden; font-size: .85rem; border-bottom: 1px solid var(--line); }
.ticker { white-space: nowrap; animation: ticker 25s linear infinite; }
@keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
.navbar { background: var(--surface); padding: 12px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1020; }
.brand-logo { height: 40px; border-radius: 6px; }
.brand-name { font-weight: 700; color: var(--primary-blue); letter-spacing: -0.5px; line-height: 1; }
.brand-subtitle { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 2px; }
.nav-link { color: var(--ink); font-weight: 500; font-size: 0.95rem; }
.nav-link:hover { color: var(--primary-blue); }
.section { padding: 48px 0; }
.surface { background: var(--surface); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--line); }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: 0.3s; background: var(--surface); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); border-color: var(--primary-blue); }
.card-img-top { height: 180px; object-fit: cover; }
.hero { background: linear-gradient(135deg, rgba(0,75,147,0.05) 0%, rgba(0,75,147,0) 100%); padding: 64px 0; border-bottom: 1px solid var(--line); }
.hero h1 { font-weight: 800; font-size: 3rem; color: var(--primary-blue); letter-spacing: -1px; margin-bottom: 16px; }
.btn { font-weight: 600; border-radius: 8px; padding: 10px 20px; transition: 0.2s; }
.btn-primary { background: var(--primary-blue); border-color: var(--primary-blue); }
.btn-primary:hover { background: var(--secondary-blue); border-color: var(--secondary-blue); }
.btn-warning { background: var(--accent-gold); border-color: var(--accent-gold); color: #fff; }
.btn-warning:hover { background: #d4a017; border-color: #d4a017; color: #fff; }
.badge { padding: 6px 12px; font-weight: 500; border-radius: 6px; font-size: 0.75rem; }
.badge-blue { background: rgba(0,75,147,0.1); color: var(--primary-blue); }
.badge-gold { background: rgba(245,166,35,0.1); color: var(--accent-gold); }
.stat { padding: 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.stat strong { display: block; font-size: 2rem; color: var(--primary-blue); font-weight: 800; margin-top: 8px; }
.stat span { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
.empty { text-align: center; padding: 48px 24px; color: var(--muted); background: var(--bg-page); border-radius: 12px; border: 1px dashed var(--line); }
.line-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qr-img { max-width: 240px; border-radius: 12px; display: block; margin: 0 auto; border: 1px solid var(--line); }
.footer { background: var(--surface); color: var(--muted); border-top: 1px solid var(--line); }

/* Admin Grid */
.admin-shell { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
.admin-nav { position: sticky; top: 80px; border-right: 1px solid var(--line); padding-right: 12px; }
.admin-nav .nav-link { color: var(--muted); border-radius: 8px; padding: 10px 16px; margin-bottom: 4px; text-align: left; }
.admin-nav .nav-link.active { background: rgba(0,75,147,0.08); color: var(--primary-blue); font-weight: 600; }

#globalLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
#globalLoader.active { opacity: 1; pointer-events: all; }
.spinner { width: 48px; height: 48px; border: 4px solid var(--primary-blue); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* Bottom Nav - Responsive (Hidden on Desktop) */
.bottom-nav { display: none; }

@media (max-width: 991px) {
  body { padding-bottom: 72px; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1030; justify-content: space-around; padding: 8px 0; padding-bottom: env(safe-area-inset-bottom, 8px); border-top: 1px solid var(--line); }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 0.75rem; text-decoration: none; flex: 1; padding: 4px 0; }
  .bottom-nav a i { font-size: 1.3rem; margin-bottom: 2px; transition: 0.2s; }
  .bottom-nav a.active { color: var(--primary-blue); font-weight: 600; }
  .bottom-nav a.active i { transform: translateY(-2px); text-shadow: 0 4px 8px rgba(0,75,147,0.2); }
  .topbar { display: none !important; }
  #userSlot { display: none !important; }
  .section { padding: 24px 0; }
  .admin-shell { grid-template-columns: 1fr; }
  .admin-nav { position: static; border-right: none; padding-right: 0; margin-bottom: 20px; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; flex-direction: row !important; white-space: nowrap; }
  .brand-subtitle { max-width: 220px; }
}
</style>
