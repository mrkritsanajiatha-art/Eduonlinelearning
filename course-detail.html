<!doctype html><html lang="th"><head><base target="_top" href="<?= app.publishedUrl ?>"><title>รายละเอียดหลักสูตร | <?= app.browserTitle ?></title><?!= include('style') ?></head>
<body>
<div class="topbar"><div id="ticker" class="ticker"></div></div>
<nav class="navbar"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="?page=home"><img class="brand-logo" src="<?= app.logoUrl ?>"><span class="brand-name">ONLINE LEARNING</span></a><div class="d-flex align-items-center gap-3"><a href="?page=cart" class="text-dark position-relative"><i class="bi bi-cart fs-5"></i><span class="cart-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.6rem; display:none;">0</span></a><span id="userSlot"></span></div></div></nav>
<main class="section"><div class="container"><div id="courseDetail"></div></div></main>
  <footer class="footer py-5 mt-5 border-top">
    <div class="container text-center">
      <h5 class="mb-3 text-primary">ติดต่อเรา</h5>
      <div class="d-flex justify-content-center gap-3 mb-4">
        <a href="https://lin.ee/I3b1Q55" target="_blank" class="btn btn-outline-success"><i class="bi bi-line"></i> Line Official</a>
        <a href="https://www.facebook.com/share/18cfh82rzr/?mibextid=wwXIfr" target="_blank" class="btn btn-outline-primary"><i class="bi bi-facebook"></i> Facebook Page</a>
      </div>
      <div class="small text-muted">ONLINE LEARNING · ศูนย์กลางการพัฒนาวิชาชีพครูและบุคลากรทางการศึกษาของประเทศไทย</div>
    </div>
  </footer>
<?!= include('script') ?>
<script>
async function uploadSlip(course){ const file=$('#slipFile').files[0]; if(!file) return toast('กรุณาเลือกไฟล์สลิป','danger'); const base64=await fileToBase64(file); await callApi('submitPaymentSlip',{courseId:course.id,amount:course.price,type:'course',fileName:file.name,mimeType:file.type,slipBase64:base64}); toast('ส่งสลิปเรียบร้อย รอผู้ดูแลระบบอนุมัติ'); }
window.pageInit=async()=>{ 
  try {
    setLoading('#courseDetail'); 
    const data=await callApi('getCourse',{id:param('id')}); 
    const c=data.course, e=data.enrollment, u=data.user;
    window.CURRENT_COURSE = c;
    $('#courseDetail').innerHTML=`<div class="row g-4"><div class="col-lg-7"><img src="${h(courseImage(c))}" class="img-fluid rounded border mb-3"><h1>${h(c.title)}</h1><p class="lead">${h(c.description)}</p><div class="d-flex flex-wrap gap-2 mb-3">${badge(c.category)} ${badge(c.type,c.type==='paid'?'gold':'blue')} ${badge(`${c.hours} ชั่วโมง`)}</div><p><strong>วิทยากร:</strong> ${h(c.instructor)}</p>
    ${(c.videoUrl && e && e.status === 'active') ? `<div class="alert alert-success mt-4"><i class="bi bi-check-circle-fill"></i> คุณสามารถเข้าสู่ห้องเรียนได้แล้ว กรุณากดปุ่มด้านขวามือ</div>` : (c.videoUrl ? `<div class="alert alert-warning mb-3 text-center"><i class="bi bi-lock-fill"></i> วีดีโอรับชมได้หลังจากได้รับการอนุมัติเข้าเรียนแล้ว</div>` : '')}</div><div class="col-lg-5"><div class="surface p-4"><h3 class="text-primary mb-1">${Number(c.price||0)>0?money(c.price):(c.type==='vip'?'สำหรับ VIP เท่านั้น':'ฟรี')}</h3>${(c.type==='paid' && Number(c.price||0)>0)?`<div class="text-danger mb-3"><i class="bi bi-star-fill text-warning"></i> สมาชิก VIP ลดเหลือ <strong>${money(c.price * 0.7)}</strong></div>`:''}<div id="enrollBox"></div></div></div></div>`;
    const box=$('#enrollBox'); 
    if(e){ 
      if(e.status === 'pending_payment' && !e.paymentId) {
        box.innerHTML=`<div class="alert alert-warning text-center mb-2">คุณลงทะเบียนไว้แล้วแต่ยังไม่ได้ชำระเงิน</div><a href="${pageUrl('payment',{courseId:c.id})}" class="btn btn-warning w-100">แจ้งชำระเงินเดิม</a> <hr> <button id="addCartBtn" class="btn btn-outline-primary w-100 mt-2"><i class="bi bi-cart-plus"></i> จ่ายรวมในตะกร้า</button>`;
      } else if(e.status === 'pending_payment' && e.paymentId) {
        box.innerHTML=`<div class="alert alert-info mb-2 text-center">ลงทะเบียนสำเร็จ รอแอดมินอนุมัติ</div>`;
      } else if(e.status === 'active') {
        box.innerHTML=`
          <div class="alert alert-success mb-3 text-center border border-success">สถานะ: เข้าเรียนได้แล้ว</div>
          <a href="${pageUrl('learn', { id: c.id })}" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm"><i class="bi bi-play-circle"></i> เข้าสู่ห้องเรียน</a>
        `;
      } else {
        box.innerHTML=`<div class="alert alert-info mb-2 text-center">สถานะ: ${h(e.status)}</div>`;
      }
    } else { 
      if(Number(c.price||0)>0){
        box.innerHTML=`
          <div class="card bg-light border-warning mb-3">
            <div class="card-body">
              <h6 class="text-warning fw-bold"><i class="bi bi-star-fill"></i> สำหรับสมาชิก VIP</h6>
              <div class="input-group mb-2">
                <input type="text" id="vipCheckLastName" class="form-control" placeholder="นามสกุล VIP">
                <button class="btn btn-warning" id="btnCheckVip">ตรวจสอบสิทธิ์</button>
              </div>
              <div id="vipOptions" style="display:none;">
                 <div class="alert alert-success py-2 mb-2 small"><i class="bi bi-check-circle"></i> ยืนยันสิทธิ์ VIP เรียบร้อย</div>
                 <div class="form-check mb-2">
                   <input class="form-check-input" type="radio" name="vipCertOpt" id="vipOptFree" value="free" checked>
                   <label class="form-check-label" for="vipOptFree">ต้องการเรียนฟรี (ไม่รับวุฒิบัตร)</label>
                 </div>
                 <div class="form-check mb-3">
                   <input class="form-check-input" type="radio" name="vipCertOpt" id="vipOptCert" value="cert">
                   <label class="form-check-label" for="vipOptCert">ต้องการรับวุฒิบัตร (ชำระ ${money(c.price * 0.7)})</label>
                 </div>
                 <button class="btn btn-primary w-100 fw-bold" id="btnVipEnroll">สมัครด้วยสิทธิ์ VIP</button>
              </div>
            </div>
          </div>
          <button id="addCartBtn" class="btn btn-outline-primary w-100 mb-2 fw-bold"><i class="bi bi-cart-plus"></i> จ่ายราคาปกติ (เพิ่มลงตะกร้า)</button>
          <a href="?page=cart" class="btn btn-secondary w-100 fw-bold"><i class="bi bi-credit-card"></i> ไปหน้าชำระเงิน / ดูตะกร้า</a>
        `;
      } else {
        box.innerHTML=`<button id="enrollBtn" class="btn btn-primary w-100 fw-bold">สมัครเข้าเรียนฟรี</button>`;
      }
    }
    $('#btnCheckVip')?.addEventListener('click', async () => {
      const ln = $('#vipCheckLastName').value.trim();
      if (!ln) return toast('กรุณากรอกนามสกุล', 'danger');
      showGlobalLoading();
      try {
        const res = await callApi('checkVip', { lastName: ln });
        $('#globalLoader').classList.remove('active');
        if (res.isVip) {
          $('#vipOptions').style.display = 'block';
          $('#vipCheckLastName').disabled = true;
          $('#btnCheckVip').style.display = 'none';
        } else {
          toast('ไม่พบนามสกุลในระบบ VIP', 'danger');
        }
      } catch(err) {
        toast(err.message, 'danger');
        $('#globalLoader').classList.remove('active');
      }
    });

    $('#btnVipEnroll')?.addEventListener('click', async () => {
      const ln = $('#vipCheckLastName').value.trim();
      const opt = $('input[name="vipCertOpt"]:checked').value; // 'free' or 'cert'
      showGlobalLoading();
      try {
        const res = await callApi('enrollCourse', { courseId: c.id, vipLastName: ln, vipOption: opt });
        $('#globalLoader').classList.remove('active');
        if (res.status === 'active') {
          toast('ลงทะเบียนฟรีสำเร็จ สามารถเข้าเรียนได้ทันที', 'success');
          window.pageInit();
        } else {
          toast('กรุณาชำระเงินส่วนต่าง (70%)', 'info');
          location.href = pageUrl('payment', { courseId: c.id, vipLastName: ln });
        }
      } catch(err) {
        toast(err.message, 'danger');
        $('#globalLoader').classList.remove('active');
      }
    });
    
    $('#enrollBtn')?.addEventListener('click',async()=>{ showGlobalLoading(); try{ await callApi('enrollCourse',{courseId:c.id, vipName:''}); toast('สมัครหลักสูตรแล้ว'); $('#globalLoader').classList.remove('active'); window.pageInit(); }catch(err){ toast(err.message,'danger'); $('#globalLoader').classList.remove('active'); } });
    $('#addCartBtn')?.addEventListener('click',()=>{ addToCart(window.CURRENT_COURSE); });
  } catch (err) {
    $('#courseDetail').innerHTML = `<div class="alert alert-danger my-4 p-4 text-center"><h4>เกิดข้อผิดพลาด</h4><p>${h(err.message)}</p><a class="btn btn-outline-danger mt-3" href="?page=courses">กลับหน้ารายการหลักสูตร</a></div>`;
  }
};
</script>
</body></html>
