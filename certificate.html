<!doctype html><html lang="th"><head><base target="_top" href="<?= app.publishedUrl ?>"><title>เกียรติบัตร | <?= app.browserTitle ?></title><?!= include('style') ?></head>
<body><div class="topbar"><div id="ticker" class="ticker"></div></div><nav class="navbar"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="?page=home"><img class="brand-logo" src="<?= app.logoUrl ?>"><span class="brand-name">ONLINE LEARNING</span></a><span id="userSlot"></span></div></nav>
<main class="section"><div class="container"><div class="d-flex justify-content-between align-items-center mb-3"><h1>เกียรติบัตรและ Transcript</h1><button id="exportTranscript" class="btn btn-primary">Export PDF</button></div><div id="certArea"></div></div></main><?!= include('script') ?>
<script>
window.pageInit=async()=>{ setLoading('#certArea'); const t=await callApi('getTranscript'); $('#certArea').innerHTML=`<div class="surface p-3"><h3>Transcript</h3><p>ชั่วโมงสะสมรวม <strong>${h(t.totalHours)}</strong> ชั่วโมง</p><div class="table-responsive"><table class="table"><thead><tr><th>ประเภท</th><th>รายการ</th><th>ชั่วโมง</th><th>Certificate ID</th><th>วันที่สำเร็จ</th></tr></thead><tbody>${t.items.map(i=>`<tr><td>${h(i.sourceType)}</td><td>${h(i.sourceTitle)}</td><td>${h(i.hours)}</td><td><a href="${pageUrl('verify',{id:i.certificateId})}">${h(i.certificateId)}</a></td><td>${h(i.completedAt)}</td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีประวัติสำเร็จหลักสูตรหรือกิจกรรม</td></tr>'}</tbody></table></div></div>`; $('#exportTranscript').addEventListener('click',async()=>{ const r=await callApi('exportTranscriptPdf'); window.open(r.url,'_blank'); }); };
</script></body></html>
