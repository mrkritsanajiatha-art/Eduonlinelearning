<!doctype html><html lang="th"><head><base target="_top" href="<?= app.publishedUrl ?>"><title>รายละเอียดกิจกรรม | <?= app.browserTitle ?></title><?!= include('style') ?></head>
<body><div class="topbar"><div id="ticker" class="ticker"></div></div><nav class="navbar"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="?page=home"><img class="brand-logo" src="<?= app.logoUrl ?>"><span class="brand-name">ONLINE LEARNING</span></a><span id="userSlot"></span></div></nav>
<main class="section"><div class="container"><div id="eventDetail"></div></div></main><?!= include('script') ?>
<script>
let currentEvent, registration; async function uploadEventSlip(){ const f=$('#eventSlip').files[0]; if(!f||!registration)return toast('กรุณาเลือกสลิป','danger'); const base64=await fileToBase64(f); const pay=await callApi('submitPaymentSlip',{eventId:currentEvent.id,amount:currentEvent.price,type:'event',fileName:f.name,mimeType:f.type,slipBase64:base64}); toast('แนบสลิปแล้ว');}
window.pageInit=async()=>{setLoading('#eventDetail'); const d=await callApi('getEvent',{id:param('id')}); currentEvent=d.event; $('#eventDetail').innerHTML=`<div class="row g-4"><div class="col-lg-7"><img src="${h(eventImage(currentEvent))}" class="img-fluid rounded border mb-3"><h1>${h(currentEvent.title)}</h1><p class="lead">${h(currentEvent.description)}</p><p><strong>วิทยากร:</strong> ${h(currentEvent.speaker)}</p><p><strong>สถานที่:</strong> ${h(currentEvent.location)}</p><p><strong>วันเวลา:</strong> ${h(currentEvent.startAt)} ${currentEvent.endAt?' - '+h(currentEvent.endAt):''}</p></div><div class="col-lg-5"><form id="regForm" class="surface p-4"><h3>${Number(currentEvent.price||0)>0?money(currentEvent.price):'ฟรี'}</h3><p>ลงทะเบียนแล้ว ${h(d.registered)} / ${h(currentEvent.capacity||'ไม่จำกัด')}</p><input name="name" class="form-control mb-2" placeholder="ชื่อ" required><input name="phone" class="form-control mb-2" placeholder="เบอร์โทร" required><input name="organization" class="form-control mb-2" placeholder="หน่วยงาน" required><button class="btn btn-primary w-100">ลงทะเบียนกิจกรรม</button><div id="eventPayBox" class="d-none mt-3"><img class="qr-img mb-2" src="<?= app.paymentQrUrl ?>"><input id="eventSlip" type="file" class="form-control mb-2" accept="image/*,application/pdf"><button type="button" id="eventSlipBtn" class="btn btn-warning w-100">แนบสลิป</button></div></form></div></div>`;
 const u=await callApi('getCurrentUser'); $('[name=name]').value=u.name||''; $('[name=phone]').value=u.phone||''; $('[name=organization]').value=u.organization||''; $('#regForm').addEventListener('submit',async e=>{e.preventDefault(); registration=await callApi('registerEvent',Object.assign(formData(e.target),{eventId:currentEvent.id})); toast('ลงทะเบียนแล้ว'); if(registration.status==='pending_payment') $('#eventPayBox').classList.remove('d-none');}); $('#eventSlipBtn').addEventListener('click',uploadEventSlip);};
</script></body></html>
