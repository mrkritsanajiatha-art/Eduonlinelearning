<script>
window.pageInit=async()=>{ 
  setLoading('#dash'); 
  const d=await callApi('myDashboard'); 
  $('#pName').value = d.user.name || '';
  $('#pPhone').value = d.user.phone || '';
  $('#pOrg').value = d.user.organization || '';

  $('#dash').innerHTML = d.enrollments.map(e => {
    const c = e.course;
    if(!c) return '';
    let statusHtml = '';
    let actionHtml = '';
    
    if (e.status === 'active' || e.status === 'completed') {
      statusHtml = `<span class="badge bg-success">อนุมัติแล้ว</span>`;
      actionHtml = `<a href="${pageUrl('course-detail',{id:c.id})}" class="btn btn-primary w-100 fw-bold">เข้าเรียน</a>`;
    } else if (e.status === 'pending_payment' && e.paymentId) {
      statusHtml = `<span class="badge bg-warning text-dark">รอแอดมินอนุมัติ</span>`;
      actionHtml = `<button class="btn btn-secondary w-100 fw-bold" disabled>รอแอดมินอนุมัติ</button>`;
    } else {
      statusHtml = `<span class="badge bg-danger">รอชำระเงิน</span>`;
      actionHtml = `<a href="${pageUrl('payment',{courseId:c.id})}" class="btn btn-warning w-100 fw-bold">ชำระเงิน</a>`;
    }

    return `<div class="col"><div class="card h-100 position-relative">
      <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 shadow-sm" onclick="unenroll('${e.id}')" title="ลบคอร์สนี้"><i class="bi bi-trash"></i></button>
      <img src="${h(courseImage(c))}" class="card-img-top">
      <div class="card-body d-flex flex-column gap-2">
        <div class="d-flex justify-content-between pe-4">${badge(c.category)} ${statusHtml}</div>
        <h5 class="card-title">${h(c.title)}</h5>
        <div class="mt-auto pt-2">${actionHtml}</div>
      </div>
    </div></div>`;
  }).join('') || '<div class="col-12"><div class="empty">คุณยังไม่ได้ลงทะเบียนเรียนคอร์สใดๆ</div></div>';
};
window.unenroll = async (enrollmentId) => {
  if(!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบหลักสูตรนี้ออกจากคอร์สของฉัน?')) return;
  showGlobalLoading();
  try {
    await callApi('unenrollCourse', { id: enrollmentId });
    toast('ลบหลักสูตรเรียบร้อยแล้ว');
    $('#globalLoader').classList.remove('active');
    window.pageInit();
  } catch(err) {
    toast(err.message, 'danger');
    $('#globalLoader').classList.remove('active');
  }
};
</script></body></html>
